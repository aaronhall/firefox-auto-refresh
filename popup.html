<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Auto Refresh</h1>
      <span id="statusDot" class="dot off" title="status"></span>
    </header>

    <div class="scope-toggle" role="radiogroup" aria-label="Refresh scope">
      <label class="scope-option">
        <input type="radio" name="scope" value="page" checked />
        <span>Page</span>
      </label>
      <label class="scope-option">
        <input type="radio" name="scope" value="domain" />
        <span>Domain</span>
      </label>
    </div>

    <div id="targetLabel" class="target" title="">—</div>

    <label class="field-label" for="intervalInput">Refresh every (seconds)</label>
    <input id="intervalInput" type="number" min="1" step="1" placeholder="e.g. 60" />

    <div class="presets" aria-label="Quick intervals">
      <button data-secs="60">1 min</button>
      <button data-secs="300">5 min</button>
      <button data-secs="900">15 min</button>
      <button data-secs="1800">30 min</button>
      <button data-secs="3600">60 min</button>
    </div>

    <div class="actions">
      <button id="saveBtn" class="primary">Start</button>
      <button id="stopBtn" class="ghost">Stop</button>
    </div>

    <div id="status" class="status"></div>
    <div id="summary" class="summary"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
